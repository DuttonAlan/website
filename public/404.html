<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Page not found · Alan Dutton</title>
    <style>
      :root {
        --bg: #ffffff;
        --ink: #0a0a0a;
        --muted: #737373;
        --line: #e5e5e5;
        --accent: #6b7a2a;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1c1f;
          --ink: #ededed;
          --muted: #a1a1aa;
          --line: #34343a;
          --accent: #a9b85a;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.6 ui-sans-serif,
          system-ui,
          sans-serif;
      }
      p.code {
        margin: 0;
        font:
          12px ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      h1 {
        margin: 16px 0 8px;
        font-size: clamp(36px, 8vw, 56px);
        line-height: 1.05;
        letter-spacing: -0.04em;
      }
      h1 span {
        color: var(--accent);
      }
      p {
        color: var(--muted);
      }
      a {
        display: inline-block;
        margin-top: 24px;
        padding: 12px 20px;
        border: 1px solid var(--ink);
        background: var(--ink);
        color: var(--bg);
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
      }
      a:hover {
        background: var(--accent);
        border-color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 / Not found</p>
      <h1>This page doesn't exist<span>.</span></h1>
      <p>The link might be broken, or the page has moved.</p>
      <a href="/">← Back to the homepage</a>
    </main>
  </body>
</html>
