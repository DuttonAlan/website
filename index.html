<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Alan Dutton</title>
    <meta name="description" content="Alan Dutton — software developer from Germany." />
    <link rel="canonical" href="https://alandutton.de/" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1c1c1f" media="(prefers-color-scheme: dark)" />

    <!-- Link previews (LinkedIn, Slack, X, …) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://alandutton.de/" />
    <meta property="og:title" content="Alan Dutton" />
    <meta property="og:description" content="Software developer from Germany." />
    <meta property="og:image" content="https://alandutton.de/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        const theme = localStorage.getItem('theme')
        if (theme) document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
